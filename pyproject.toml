[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledgerlens"
version = "0.1.0"
description = "An evidence-based AI assistant for financial reports"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LedgerLens contributors" }]
dependencies = [
    "pdfplumber>=0.11.10",
]

[project.scripts]
ledgerlens = "ledgerlens.cli:main"

[project.optional-dependencies]
recovery = [
    "pypdf>=6.21.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "reportlab>=5.0.1",
    "ruff>=0.11,<0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerlens"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
